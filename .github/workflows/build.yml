name: Compile Aether browser
on:
  push:
    branches: [dev]
    paths: ['ci/build-request.json']
  workflow_dispatch:
    inputs:
      source_ref:
        type: string
        default: dev
        description: Source branch, tag or SHA
      platform:
        type: choice
        options: [both, windows, linux]
        default: both
      runner_label:
        type: string
        default: ''
        description: Optional existing larger-runner label (choose one platform)
      queue_after_current:
        type: boolean
        default: false
        description: Queue behind an active build without discarding its progress
      continuation:
        type: number
        default: 0
        description: Internal bounded native-checkpoint counter (0-4)
permissions:
  contents: read
jobs:
  request:
    name: Select actual build targets
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.select.outputs.platforms }}
      queue: ${{ steps.select.outputs.queue }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: select
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform || 'both' }}
          REQUESTED_QUEUE: ${{ inputs.queue_after_current }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          selected = os.environ['REQUESTED_PLATFORM']
          request = json.loads(Path('ci/build-request.json').read_text())
          queued = (request.get('queue_after_current', False) if os.environ['GITHUB_EVENT_NAME'] == 'push'
                    else os.environ['REQUESTED_QUEUE'] == 'true')
          if type(queued) is not bool:
              raise ValueError('queue_after_current must be a boolean')
          platforms = (request['platforms']
                       if os.environ['GITHUB_EVENT_NAME'] == 'push'
                       else ['windows', 'linux'] if selected == 'both' else [selected])
          if (not isinstance(platforms, list) or not platforms or
              len(set(platforms)) != len(platforms) or
              any(p not in ('windows', 'linux') for p in platforms)):
              raise ValueError('Build request must select windows and/or linux')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as out:
              out.write('platforms=' + json.dumps(platforms) + '\n')
              out.write('queue=' + str(queued).lower() + '\n')
          PYTHON
  browser:
    needs: request
    permissions:
      contents: read
      actions: write
    concurrency:
      group: compile-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: ${{ needs.request.outputs.queue != 'true' }}
    name: Real Chromium build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.request.outputs.platforms) }}
    runs-on: ${{ inputs.runner_label || (matrix.platform == 'windows' && 'windows-2025-vs2026' || 'ubuntu-24.04') }}
    timeout-minutes: 355
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Choose short build path on the measured volume with most free space
        shell: bash
        run: python scripts/hosted.py select-path ${{ matrix.platform }}
      - name: Measure hardware, preserve toolchains and free disposable image packages
        shell: bash
        run: python scripts/hosted.py prepare ${{ matrix.platform }} --work-dir "$AETHER_WORK_DIR"
      - name: Install hash-pinned Microsoft SDK required by this Chromium revision
        if: matrix.platform == 'windows'
        shell: pwsh
        timeout-minutes: 20
        run: ./scripts/install_windows_sdk.ps1
      - name: Preserve initial measured runner capacity before the long build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aether-runner-${{ matrix.platform }}-${{ github.run_id }}
          path: dist/hosted/
          if-no-files-found: error
          retention-days: 7
      - name: Install Python build dependencies
        shell: bash
        run: python -m pip install -r requirements-build.txt
      - name: Install Linux development libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex gperf ninja-build pkg-config zstd xz-utils libasound2-dev libatk1.0-dev libatk-bridge2.0-dev libcups2-dev libdbus-1-dev libdrm-dev libgbm-dev libglib2.0-dev libgtk-3-dev libnss3-dev libpango1.0-dev libpulse-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcomposite-dev libxcursor-dev libxdamage-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxrender-dev libxss-dev libxtst-dev libxkbcommon-dev libxshmfence-dev libudev-dev libpci-dev libpipewire-0.3-dev libkrb5-dev
          sudo apt-get clean
      - name: Prepare actual pinned Chromium source and Aether overlay
        id: source
        shell: bash
        timeout-minutes: 60
        run: python scripts/hosted.py source ${{ matrix.platform }} --work-dir "$AETHER_WORK_DIR" -j 4
      - name: Identify compatible compiled outputs
        id: identity
        shell: bash
        run: python scripts/hosted.py cache-info ${{ matrix.platform }} --work-dir "$AETHER_WORK_DIR"
      - name: Restore compatible incremental compiler output
        id: objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        timeout-minutes: 15
        with:
          path: ${{ env.AETHER_WORK_DIR }}/${{ matrix.platform }}/build/src/out/Default
          key: ${{ steps.identity.outputs.cache-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.identity.outputs.cache-prefix }}-
            ${{ steps.identity.outputs.restore-prefix }}-
      - name: Restore timestamps only for hash-verified unchanged inputs
        shell: bash
        run: python scripts/hosted.py restore-inputs ${{ matrix.platform }} --work-dir "$AETHER_WORK_DIR"
      - name: Actually generate GN and compile Chromium
        id: compile
        # Leave time to preserve real outputs and diagnostics before the job cap.
        # An expired compile window fails this job; it never implies success.
        timeout-minutes: 240
        shell: bash
        run: python scripts/hosted.py build ${{ matrix.platform }} --work-dir "$AETHER_WORK_DIR" -j 4
      - name: Measure actual incremental output size
        if: always() && steps.identity.outcome == 'success' && !cancelled()
        continue-on-error: true
        shell: bash
        run: python scripts/hosted.py cache-info ${{ matrix.platform }} --work-dir "$AETHER_WORK_DIR"
      - name: Record input timestamps for the next incremental attempt
        id: timestamps
        if: always() && steps.identity.outcome == 'success' && !cancelled()
        continue-on-error: true
        shell: bash
        run: python scripts/hosted.py capture-inputs ${{ matrix.platform }} --work-dir "$AETHER_WORK_DIR"
      - name: Preserve compiler output including an interrupted compile window
        id: save_objects
        if: always() && steps.timestamps.outcome == 'success' && !cancelled()
        # A storage/quota failure must not prevent packaging a compiled browser.
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        timeout-minutes: 20
        with:
          path: ${{ env.AETHER_WORK_DIR }}/${{ matrix.platform }}/build/src/out/Default
          key: ${{ steps.identity.outputs.cache-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Archive compiled browser and component runtime
        shell: bash
        run: python scripts/runtime.py ${{ matrix.platform }} --source "$AETHER_WORK_DIR/${{ matrix.platform }}/build/src"
      - name: Test actual browser navigation and setup
        shell: bash
        run: |
          extension=zip
          if [ '${{ matrix.platform }}' = linux ]; then extension=tar.gz; fi
          python scripts/smoke.py --source "$AETHER_WORK_DIR/${{ matrix.platform }}/build/src" --archive "dist/runtime/aether-component-${{ matrix.platform }}-x64.$extension" --output dist/smoke.json
      - name: Upload executable/runtime when compilation produced it
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aether-runtime-${{ matrix.platform }}-${{ github.run_id }}
          path: dist/runtime/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve actual logs and measured hardware/resource evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aether-build-evidence-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            dist/hosted/
            dist/smoke.json
          if-no-files-found: warn
          retention-days: 7
      - name: Continue a native checkpoint only after verified object and cache progress
        if: always() && steps.compile.outcome == 'failure' && steps.save_objects.outcome == 'success' && !cancelled()
        continue-on-error: true
        shell: bash
        env:
          AETHER_ACTIONS_TOKEN: ${{ github.token }}
          AETHER_CACHE_KEY: ${{ steps.objects.outputs.cache-primary-key }}
          AETHER_CONTINUATION: ${{ inputs.continuation || 0 }}
          AETHER_RUNNER_LABEL: ${{ inputs.runner_label || '' }}
        run: python scripts/continue_build.py --platform ${{ matrix.platform }} --count "$AETHER_CONTINUATION" --cache-key "$AETHER_CACHE_KEY" --runner-label "$AETHER_RUNNER_LABEL"
