name: Validate source
on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Tooling and configuration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python3 scripts/check.py
      - run: python3 scripts/verify_resources.py --download-grit
      - run: git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resource-evidence
          path: .work/resource-evidence.json
          include-hidden-files: true
          if-no-files-found: error
  patches:
    name: Exact upstream patches (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch pinned patch repositories, not Chromium
        run: python3 scripts/bootstrap.py ${{ matrix.platform }}
      - name: Apply every relevant upstream hunk and the Aether series
        run: python3 scripts/verify_patches.py ${{ matrix.platform }} --upstream .work/${{ matrix.platform }} --destination .work/verified-${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: patch-evidence-${{ matrix.platform }}
          path: .work/verified-${{ matrix.platform }}/verification.json
          include-hidden-files: true
          if-no-files-found: error
